services:
  - type: web
    name: ozturk-ambalaj-depo
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend --include=dev && npm ci --prefix frontend --include=dev && npm run build --prefix backend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: /api
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
